<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#02040a" />
  <title>VJ Storm V3 - Audio Reactive WebGPU</title>
  <link rel="stylesheet" href="./styles.css?v=3" />
</head>
<body>
  <canvas id="storm-canvas"></canvas>

  <div id="hud" class="hud">
    <div class="panel" id="panel">
      <div class="topline">
        <div>
          <div class="brand">VJ STORM V3</div>
          <div class="status" id="status">Инициализация WebGPU...</div>
        </div>
        <button id="hide-ui" class="icon-btn" aria-label="Скрыть интерфейс">×</button>
      </div>

      <label class="file-button">
        <input id="audio-file" type="file" accept="audio/*" />
        <span>Выбрать трек</span>
      </label>

      <div id="analysis-block" class="analysis-block hidden">
        <div class="progress-row">
          <span id="analysis-stage">Анализ...</span>
          <span id="analysis-percent">0%</span>
        </div>
        <div class="progress-track"><div id="analysis-progress" class="progress-fill"></div></div>
      </div>

      <canvas id="track-map" class="track-map hidden" width="900" height="220"></canvas>

      <div class="telemetry hidden" id="telemetry">
        <div><span>BPM</span><strong id="bpm">-</strong></div>
        <div><span>ENERGY</span><strong id="energy">0</strong></div>
        <div><span>DRUMS</span><strong id="drums">0</strong></div>
        <div><span>VOCAL EST</span><strong id="vocal">0</strong></div>
      </div>

      <div class="meters hidden" id="meters">
        <div class="meter"><span>SUB</span><i><b id="m-sub"></b></i></div>
        <div class="meter"><span>BASS</span><i><b id="m-bass"></b></i></div>
        <div class="meter"><span>LOW MID</span><i><b id="m-lowmid"></b></i></div>
        <div class="meter"><span>VOCAL</span><i><b id="m-vocal"></b></i></div>
        <div class="meter"><span>HIGH</span><i><b id="m-high"></b></i></div>
        <div class="meter"><span>AIR</span><i><b id="m-air"></b></i></div>
      </div>

      <div class="controls">
        <button id="play" disabled>Play</button>
        <button id="record" disabled>REC</button>
        <button id="fullscreen">Fullscreen</button>
      </div>

      <div class="sliders">
        <label>Lightning <input id="lightning-sens" type="range" min="0" max="1.6" step="0.05" value="1" /></label>
        <label>Rain <input id="rain-sens" type="range" min="0" max="1.6" step="0.05" value="1" /></label>
        <label>Vocal layer <input id="vocal-sens" type="range" min="0" max="1.6" step="0.05" value="1" /></label>
      </div>

      <div class="compact-settings">
        <label><input id="thunder" type="checkbox" checked /> Thunder FX</label>
        <label><input id="auto-quality" type="checkbox" checked /> Auto quality</label>
      </div>
    </div>

    <button id="show-ui" class="show-ui hidden" aria-label="Показать интерфейс">UI</button>
    <div id="timeline" class="timeline hidden"><div id="timeline-fill"></div></div>
  </div>

  <script type="module" src="./src/app.js?v=3"></script>
</body>
</html>
